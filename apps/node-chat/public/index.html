<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat</title>
    <style>
      body { font: 16px/1.4 system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
      form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
      input { flex: 1; padding: 0.4rem; }
      #log { list-style: none; padding: 0; height: 20rem; overflow-y: auto; border: 1px solid #ccc; margin: 0 0 1rem; }
      #log li { padding: 0.25rem 0.5rem; }
    </style>
  </head>
  <body>
    <h1>Chat</h1>
    <form id="join">
      <input id="room" placeholder="room" value="lobby" />
      <input id="name" placeholder="your name" />
      <button>Join</button>
    </form>
    <ul id="log"></ul>
    <form id="send">
      <input id="text" placeholder="message" autocomplete="off" />
      <button>Send</button>
    </form>
    <script type="module" src="/app.js"></script>
  </body>
</html>
