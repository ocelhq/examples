# yaml-language-server: $schema=https://ocel.dev/schema/ocel.schema.json
slug: my-app
provider:
  aws:
    region: eu-west-1
    edge: cloudfront
    dns:
      route53:
        zone: example.com
    # Hostnames left off get a certificate ocel requests and renews.
    # CloudFront serves only certificates issued in us-east-1.
    certificates:
      example.com: arn:aws:acm:us-east-1:123456789012:certificate/0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
      www.example.com: arn:aws:acm:us-east-1:123456789012:certificate/0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
    variablesKey: arn:aws:kms:eu-west-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab
    bytecode:
      cache: true
    logs:
      liveTail: true
domains:
  preview: "*.preview.example.com"
apps:
  - name: web
    path: apps/web
    arch: arm64
    domains:
      production:
        - example.com
        - www.example.com
  - name: api
    path: apps/api
    compute:
      container:
        health:
          path: /health
        instances:
          min: 2
          max: 10
    domains:
      production: api.example.com
discovery:
  paths:
    - infra
    - apps/*/infra
bindings:
  postgres:
    analytics: "@warehouse"
    # Production binds a database you run; every preview provisions its own.
    main:
      production:
        url:
          $env: MAIN_DATABASE_URL
envSource:
  production:
    infisical:
      project: 4f1c2e0a-9d3b-4c6e-8a7f-2b5d1e0c9a84
      environment: prod
      auth:
        identity:
          identityId: b7d0e3f1-5a2c-4d8e-9b6f-0c1a2d3e4f5a
  preview:
    infisical:
      project: 4f1c2e0a-9d3b-4c6e-8a7f-2b5d1e0c9a84
      environment: staging
      auth:
        identity:
          identityId: b7d0e3f1-5a2c-4d8e-9b6f-0c1a2d3e4f5a
      write: missing
  dev:
    infisical:
      project: 4f1c2e0a-9d3b-4c6e-8a7f-2b5d1e0c9a84
      environment: dev
lifecycle:
  preBuild:
    command: pnpm db:migrate
    app: api
    timeout: 15m
protection:
  preview: true
transforms:
  - ./transforms/defaults.transform.ts
# A partial prerender's shell and resumed stream both come from the origin,
# rather than refusing the deploy.
allowDegraded:
  - ppr-resume
